<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#050505">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Mein Trainingsplan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: schwarze Oberfläche, rote Akzente, Kartenstapel mit Kleinbuchstaben-Labels, feste Tab-Leiste unten (Home, Plan, Fortschritt, Ernährung) */
  --bg:#050505;
  --card:#0f0f10;
  --card2:#151516;
  --line:#222224;
  --ink:#f5f5f5;
  --muted:#8b8b90;
  --dim:#5c5c62;
  --red:#e30b00;
  --red-ink:#ffffff;
  --red-soft:#2a0b09;
  --font:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme: dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg)}
body{color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.4;-webkit-text-size-adjust:100%}
.shell{max-width:480px;margin:0 auto;min-height:100vh;padding:calc(env(safe-area-inset-top) + 22px) 20px calc(110px + env(safe-area-inset-bottom))}
button{font-family:inherit;font-size:15px;color:inherit;cursor:pointer;background:none;border:0;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.kicker{font-size:12px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.kicker.red{color:var(--red)}
h1{font-size:34px;line-height:1.05;font-weight:800;margin:6px 0 0;letter-spacing:-.01em}
h1.big{font-size:40px;text-transform:uppercase}
.sub{color:var(--muted);font-size:13px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;margin-top:6px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:40px}
.topbtn{color:var(--muted);font-weight:600;font-size:15px;padding:8px 0;display:flex;align-items:center;gap:6px}
.pill{border:1px solid var(--line);background:var(--card);color:var(--ink);font-weight:600;font-size:14px;padding:8px 14px;border-radius:999px;min-height:38px}
.pill.on{background:var(--red);border-color:var(--red);color:var(--red-ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px}
.mission{margin-top:26px;position:relative;overflow:hidden}
.mission h2{font-size:28px;font-weight:800;text-transform:uppercase;margin:8px 0 4px;line-height:1.1;letter-spacing:-.01em}
.mission .meta{color:var(--muted);font-size:14px;text-transform:uppercase;letter-spacing:.06em}
.cta{display:block;width:100%;background:var(--red);color:var(--red-ink);font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:15px;border-radius:12px;min-height:52px;margin-top:20px}
.section{margin-top:30px}
.section .kicker{margin-bottom:12px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:8px 0 9px;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:68px}
.wd .l{font-size:10px;font-weight:600;letter-spacing:.1em;color:var(--muted)}
.wd .n{font-size:19px;font-weight:700}
.wd .d{width:6px;height:6px;border-radius:50%;background:transparent;margin-top:2px}
.wd.has .d{background:var(--dim)}
.wd.done .d{background:var(--red)}
.wd.today{border-color:var(--red);background:var(--red-soft)}
.wd.today .l,.wd.today .n{color:#ff4a3f}
.wd:disabled{cursor:default}
.ring{display:flex;align-items:center;gap:18px}
.ring .txt b{font-size:30px;font-weight:800;display:block;line-height:1}
.ring .txt span{color:var(--muted);font-size:14px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;min-height:88px}
.stat b{display:block;font-size:30px;font-weight:800;line-height:1}
.stat span{color:var(--muted);font-size:13px;display:block;margin-top:8px}
.stat.hot{background:linear-gradient(160deg,#3a0b08,#120808 70%);border-color:#3b1411}
.stat.hot b{color:var(--red)}
.daycard{width:100%;text-align:left;display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:10px}
.daycard .a{min-width:0}
.daycard .t{font-size:19px;font-weight:800;text-transform:uppercase;letter-spacing:-.005em}
.daycard .s{color:var(--muted);font-size:13px;margin-top:3px}
.badge{font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:5px 10px;white-space:nowrap}
.badge.ok{color:var(--red-ink);background:var(--red);border-color:var(--red)}
.dashed{width:100%;border:1px dashed #333;color:var(--muted);border-radius:16px;min-height:52px;font-weight:600;margin-top:2px}
.prog{display:flex;align-items:center;gap:12px;margin-top:18px;color:var(--muted);font-size:13px}
.prog .bar{flex:1;height:3px;border-radius:2px;background:#232325;overflow:hidden}
.prog .bar i{display:block;height:100%;background:var(--red);width:0}
.rail{margin-top:22px;border-left:2px solid var(--red);padding-left:14px;display:flex;flex-direction:column;gap:12px}
.ex{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:11px}
.ex.done{border-color:#4a1511}
.exh{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.exn{font-size:18px;font-weight:700;line-height:1.2;overflow-wrap:anywhere}
.exi{color:var(--red);font-weight:700;font-size:13px;letter-spacing:.04em;text-transform:uppercase;margin-top:4px}
.exnote{color:var(--muted);font-size:13px;margin-top:3px}
.chk{flex:0 0 auto;width:30px;height:30px;border-radius:50%;border:2px solid #333;display:grid;place-items:center;background:transparent}
.chk.on{background:var(--red);border-color:var(--red)}
.chk svg{opacity:0}
.chk.on svg{opacity:1}
.grid{display:grid;grid-template-columns:1.2fr .6fr 1.2fr;gap:8px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f label{font-size:10px;font-weight:600;letter-spacing:.12em;color:var(--dim);text-transform:uppercase}
input[type=text],input[type=number],select{width:100%;min-width:0;font-family:inherit;font-size:16px;font-weight:500;color:var(--ink);background:var(--card2);border:1px solid #232326;border-radius:11px;padding:11px 12px;min-height:46px}
select{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,#8b8b90 50%),linear-gradient(135deg,#8b8b90 50%,transparent 50%);background-position:calc(100% - 18px) 20px,calc(100% - 13px) 20px;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:32px}
input::placeholder{color:#55555a}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;border-top:1px solid var(--line);padding-top:11px}
.tools select{width:auto;flex:1 1 120px;min-height:38px;padding:7px 30px 7px 10px;font-size:14px;background-position:calc(100% - 16px) 16px,calc(100% - 11px) 16px}
.sm{border:1px solid var(--line);background:var(--card2);border-radius:10px;min-height:38px;padding:7px 12px;font-weight:600;font-size:14px}
.sm.danger{color:#ff6a60;border-color:#4a1a16}
.dayedit{display:flex;flex-direction:column;gap:8px;margin-top:18px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.empty{border:1px dashed #333;border-radius:16px;padding:22px 16px;text-align:center;color:var(--muted);margin-top:18px}
.empty p{margin:0 0 12px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg button{border:1px solid var(--line);background:var(--card);border-radius:12px;min-height:50px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--red-soft);border-color:var(--red);color:var(--ink)}
.form{display:flex;flex-direction:column;gap:16px;margin-top:22px}
.res{margin-top:20px}
.res .big{font-size:42px;font-weight:800;line-height:1}
.res .big small{font-size:16px;font-weight:600;color:var(--muted);margin-left:6px}
.macros{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.macros div{background:var(--card2);border-radius:12px;padding:12px}
.macros b{display:block;font-size:20px;font-weight:800}
.macros span{font-size:11px;font-weight:600;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
.fine{color:var(--dim);font-size:12.5px;margin-top:14px}
.hist{display:flex;flex-direction:column;gap:10px}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:14px}
.hrow .nm{font-weight:700;font-size:15px;min-width:0;overflow-wrap:anywhere}
.hrow .vl{color:var(--muted);font-size:13px;margin-top:2px}
.status{margin-top:26px;font-size:12px;color:var(--dim);text-align:center;min-height:16px}
.status .warn{color:#ff6a60}
nav.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:5;background:rgba(8,8,8,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line)}
nav.tabbar .in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);padding:8px 8px calc(8px + env(safe-area-inset-bottom))}
nav.tabbar button{display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--dim);font-size:11px;font-weight:600;padding:6px 0;min-height:52px}
nav.tabbar button.on{color:var(--red)}
@media (max-width:360px){.grid{grid-template-columns:1fr 1fr}.grid .f:last-child{grid-column:1 / -1}}
@media (prefers-reduced-motion: no-preference){.chk,.pill,.cta,.wd{transition:background .15s,border-color .15s,color .15s}}
</style>
</head>
<body>
<div class="shell">
  <main id="app"></main>
  <div class="status" id="status" aria-live="polite">Lädt…</div>
</div>
<nav class="tabbar" aria-label="Hauptmenü"><div class="in" id="nav"></div></nav>
<script>
(function(){
  var $ = function(s){ return document.querySelector(s); };
  var state = null, db = null, ref = null;
  var view = 'home', activeId = null, editing = false, confirmKey = null, confirmTimer = null;
  var timer = null, writing = false, again = false, lastRev = 0, loadTimer = null, loaded = false, needsStartSave = false;
  var nutriOut = null;
  var WD = ['montag','dienstag','mittwoch','donnerstag','freitag','samstag','sonntag'];
  var WDS = ['MO','DI','MI','DO','FR','SA','SO'];

  function uid(){ return Math.random().toString(36).slice(2, 9); }

  function h(tag, attrs){
    var el = document.createElement(tag);
    var a = attrs || {};
    Object.keys(a).forEach(function(k){
      var v = a[k];
      if (v === false || v == null) return;
      if (k === 'class') el.className = v;
      else if (k === 'text') el.textContent = v;
      else if (k === 'value') el.value = v;
      else if (k.indexOf('on') === 0) el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? '' : v);
    });
    for (var i = 2; i < arguments.length; i++){
      var kid = arguments[i];
      if (Array.isArray(kid)) { kid.forEach(function(x){ if (x) el.append(x); }); }
      else if (kid != null && kid !== false) el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
    }
    return el;
  }

  function svg(html, w, hgt){
    var s = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    s.setAttribute('viewBox', '0 0 ' + w + ' ' + hgt);
    s.setAttribute('width', w); s.setAttribute('height', hgt);
    s.setAttribute('aria-hidden', 'true');
    s.innerHTML = html;
    return s;
  }

  /* ---------- Datum ---------- */
  function pad(n){ return n < 10 ? '0' + n : '' + n; }
  function ymd(d){ return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function mondayOf(d){
    var x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    x.setDate(x.getDate() - ((x.getDay() + 6) % 7));
    return x;
  }
  function weekKey(){ return ymd(mondayOf(new Date())); }
  function todayIdx(){ return (new Date().getDay() + 6) % 7; }
  function weekNumber(){
    var s = state && state.start ? new Date(state.start + 'T00:00:00') : mondayOf(new Date());
    var diff = Math.round((mondayOf(new Date()) - mondayOf(s)) / 604800000);
    return Math.max(1, diff + 1);
  }
  function dayIndex(day){
    var n = String(day.name || '').toLowerCase();
    for (var i = 0; i < 7; i++) if (n.indexOf(WD[i]) === 0) return i;
    return -1;
  }

  /* ---------- Status & Speichern ---------- */
  function setStatus(txt, warn){
    var el = $('#status');
    el.textContent = '';
    el.append(warn ? h('span', {class:'warn', text:txt}) : document.createTextNode(txt));
  }
  function savedLine(){
    if (state && state.updated){
      var d = new Date(state.updated);
      if (!isNaN(d)) return 'Gespeichert: ' + d.toLocaleString('de-CH', {day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit'});
    }
    return 'Bereit';
  }

  function normalize(d){
    var days = (d && Array.isArray(d.days)) ? d.days : [];
    var out = {
      rev: (d && d.rev) || 0,
      updated: (d && d.updated) || '',
      start: (d && typeof d.start === 'string') ? d.start : '',
      log: (d && d.log && typeof d.log === 'object') ? d.log : {},
      hist: (d && Array.isArray(d.hist)) ? d.hist : [],
      nutri: (d && d.nutri && typeof d.nutri === 'object') ? d.nutri : null,
      days: days.map(function(day){
        var ex = Array.isArray(day.exercises) ? day.exercises : [];
        return {
          id: String(day.id || uid()),
          name: String(day.name || ''),
          title: String(day.title || ''),
          exercises: ex.map(function(e){
            return {
              id: String(e.id || uid()),
              name: String(e.name || ''),
              scheme: String(e.scheme || ''),
              rir: String(e.rir || ''),
              weight: String(e.weight || ''),
              note: String(e.note || '')
            };
          })
        };
      })
    };
    if (!out.start){ out.start = ymd(mondayOf(new Date())); needsStartSave = true; }
    return out;
  }

  function save(){
    setStatus('Speichern…');
    clearTimeout(timer);
    timer = setTimeout(flush, 500);
  }

  function flush(){
    timer = null;
    if (!ref){ setStatus('Nicht gespeichert: Speicher im Browser ist blockiert.', true); return; }
    if (writing){ again = true; return; }
    writing = true;
    state.rev = Date.now();
    state.updated = new Date().toISOString();
    lastRev = state.rev;
    var payload = JSON.parse(JSON.stringify(state));
    Promise.resolve().then(function(){ return ref.set(payload); }).then(function(){
      setStatus(savedLine());
    }).catch(function(){
      setStatus('Speichern fehlgeschlagen. Eventuell ist der Browser-Speicher voll oder blockiert (privater Modus?).', true);
    }).then(function(){
      writing = false;
      if (again){ again = false; flush(); }
    });
  }

  /* ---------- Hilfen ---------- */
  function findDay(id){
    for (var i = 0; i < state.days.length; i++) if (state.days[i].id === id) return i;
    return -1;
  }
  function askConfirm(key){
    confirmKey = key;
    clearTimeout(confirmTimer);
    confirmTimer = setTimeout(function(){ confirmKey = null; render(); }, 3500);
    render();
  }
  function swap(arr, i, j){
    if (j < 0 || j >= arr.length) return;
    var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
  }
  function num(s){
    var m = String(s || '').match(/\d+(?:[.,]\d+)?/);
    return m ? parseFloat(m[0].replace(',', '.')) : null;
  }
  function weekLog(k){ return (state.log && state.log[k]) || {}; }
  function isDone(ex, k){ return !!weekLog(k || weekKey())[ex.id]; }
  function dayDoneCount(day, k){
    var c = 0; day.exercises.forEach(function(e){ if (isDone(e, k)) c++; }); return c;
  }
  function dayComplete(day, k){ return day.exercises.length > 0 && dayDoneCount(day, k) === day.exercises.length; }
  function sessionsTotal(){
    var t = 0;
    Object.keys(state.log || {}).forEach(function(k){
      state.days.forEach(function(d){ if (dayComplete(d, k)) t++; });
    });
    return t;
  }
  function toggleDone(ex){
    var k = weekKey();
    if (!state.log[k]) state.log[k] = {};
    if (state.log[k][ex.id]) delete state.log[k][ex.id]; else state.log[k][ex.id] = 1;
    save(); render(true);
  }
  function recordWeight(ex, oldVal){
    var n = num(ex.weight);
    if (n == null) return;
    var mine = state.hist.filter(function(x){ return x.id === ex.id; });
    var last = mine.length ? mine[mine.length - 1] : null;
    if (last && last.v === n) return;
    if (!last){
      var o = num(oldVal);
      if (o != null && o !== n) state.hist.push({id:ex.id, n:ex.name, v:o, d:state.start || ymd(new Date())});
    }
    state.hist.push({id:ex.id, n:ex.name, v:n, d:ymd(new Date())});
    if (state.hist.length > 500) state.hist = state.hist.slice(-500);
    save();
  }
  function go(v, id){
    view = v; if (id) activeId = id;
    editing = false; confirmKey = null;
    render(); window.scrollTo(0, 0);
  }

  /* ---------- Navigation ---------- */
  var icons = {
    home:'<path d="M3 11.5 12 4l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
    plan:'<rect x="3.5" y="4" width="17" height="16" rx="2.5"/><path d="M3.5 9h17"/>',
    progress:'<path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/>',
    food:'<path d="M7 3v8M5 3v5a2 2 0 0 0 4 0V3M7 11v10M17 3c-2 2-2.5 5-2.5 8h2.5v10"/>'
  };
  function renderNav(){
    var nav = $('#nav');
    nav.textContent = '';
    [['home','Home'],['plan','Plan'],['progress','Fortschritt'],['food','Ernährung']].forEach(function(t){
      var on = (view === t[0]) || (view === 'session' && t[0] === 'plan');
      var b = h('button', {type:'button', class: on ? 'on' : '', 'aria-label':t[1], 'aria-current': on ? 'page' : false});
      b.append(svg('<g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' + icons[t[0]] + '</g>', 24, 24), h('span', {text:t[1]}));
      b.addEventListener('click', function(){ go(t[0]); });
      nav.append(b);
    });
  }

  /* ---------- Home ---------- */
  function nextDay(){
    var k = weekKey(), ti = todayIdx();
    var cands = state.days.filter(function(d){ return d.exercises.length && !dayComplete(d, k); });
    if (!cands.length) return null;
    function key(d){ var i = dayIndex(d); return i < 0 ? 99 : i; }
    var upcoming = cands.filter(function(d){ return key(d) >= ti; });
    var pool = upcoming.length ? upcoming : cands;
    pool = pool.slice().sort(function(a, b){ return key(a) - key(b); });
    return pool[0];
  }

  function ringSvg(p){
    var r = 30, c = 2 * Math.PI * r, off = c * (1 - p);
    return svg('<circle cx="40" cy="40" r="' + r + '" fill="none" stroke="#1e1e20" stroke-width="8"/>' +
      '<circle cx="40" cy="40" r="' + r + '" fill="none" stroke="#e30b00" stroke-width="8" stroke-linecap="round" stroke-dasharray="' + c.toFixed(1) + '" stroke-dashoffset="' + off.toFixed(1) + '" transform="rotate(-90 40 40)"/>', 80, 80);
  }

  function renderHome(root){
    var k = weekKey();
    root.append(h('div', {class:'kicker', text:'Mein Training · ' + state.days.length + ' Tage'}));
    root.append(h('h1', {text:'Woche ' + weekNumber()}));
    var mon = mondayOf(new Date());
    root.append(h('div', {class:'sub', text:'ab ' + mon.toLocaleDateString('de-CH', {day:'2-digit', month:'2-digit'})}));

    var nd = nextDay();
    var m = h('div', {class:'card mission'});
    if (!state.days.length){
      m.append(h('div', {class:'kicker red', text:'Noch kein Plan'}), h('h2', {text:'Ersten Tag anlegen'}));
      m.append(h('button', {class:'cta', type:'button', text:'Plan öffnen', onclick:function(){ go('plan'); }}));
    } else if (nd){
      m.append(h('div', {class:'kicker red', text:'Deine nächste Einheit'}));
      m.append(h('h2', {text:(nd.name || 'Tag') + (nd.title ? ' · ' + nd.title : '')}));
      m.append(h('div', {class:'meta', text:nd.exercises.length + ' Übungen · ' + dayDoneCount(nd, k) + ' erledigt'}));
      m.append(h('button', {class:'cta', type:'button', text:'Training starten', onclick:function(){ go('session', nd.id); }}));
    } else {
      m.append(h('div', {class:'kicker red', text:'Diese Woche'}), h('h2', {text:'Alles geschafft'}));
      m.append(h('div', {class:'meta', text:'Alle Einheiten sind abgehakt.'}));
    }
    root.append(m);

    var sec = h('div', {class:'section'}, h('div', {class:'kicker', text:'Diese Woche'}));
    var week = h('div', {class:'week'});
    var ti = todayIdx();
    for (var i = 0; i < 7; i++){
      (function(i){

  /* ---------- Fortschritt ---------- */
  function spark(vals){
    var w = 96, hh = 34, min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
    var rng = max - min || 1;
    var pts = vals.map(function(v, i){
      var x = vals.length === 1 ? w / 2 : 3 + i * (w - 6) / (vals.length - 1);
      var y = hh - 4 - (v - min) / rng * (hh - 8);
      return x.toFixed(1) + ',' + y.toFixed(1);
    });
    var last = pts[pts.length - 1].split(',');
    return svg('<polyline points="' + pts.join(' ') + '" fill="none" stroke="#e30b00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="' + last[0] + '" cy="' + last[1] + '" r="3" fill="#e30b00"/>', w, hh);
  }

      groups[x.id].name = x.n;

    });

        ));
